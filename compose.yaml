services:
  radicale:
    image: tomsquest/docker-radicale:3.9.0.0
    ports:
      - "127.0.0.1:5232:5232"
    environment:
      RADICALE_CONFIG_SERVER_HOSTS: 0.0.0.0:5232
      RADICALE_CONFIG_AUTH_TYPE: none
      RADICALE_CONFIG_STORAGE_FILESYSTEM_FOLDER: /data/collections
    volumes:
      - radicale-data:/data
    restart: unless-stopped

  baikal:
    image: ckulka/baikal:nginx
    ports:
      - "127.0.0.1:5233:80"
    entrypoint:
      - sh
      - -c
      - |
        if [ ! -f /var/www/baikal/Specific/db/db.sqlite ]; then
          cp -r /seed/. /var/www/baikal/
          chown -R --reference=/var/www/baikal/html /var/www/baikal/config /var/www/baikal/Specific
        fi
        exec /docker-entrypoint.sh nginx -g "daemon off;"
    volumes:
      - ./baikal:/seed:ro
      - baikal-config:/var/www/baikal/config
      - baikal-data:/var/www/baikal/Specific
    restart: unless-stopped

volumes:
  radicale-data:
  baikal-config:
  baikal-data:
