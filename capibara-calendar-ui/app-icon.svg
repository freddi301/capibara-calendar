<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Page: emerald to fuchsia nebula, so it reads on light and dark backgrounds -->
    <linearGradient id="page" x1="0" y1="8" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b6b66"/>
      <stop offset="0.35" stop-color="#0e8a7c"/>
      <stop offset="0.6" stop-color="#14909a"/>
      <stop offset="0.8" stop-color="#bb2f7c"/>
      <stop offset="1" stop-color="#da2c84"/>
    </linearGradient>
    <radialGradient id="glow-pink" cx="56" cy="28" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f45fb8" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#f45fb8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-mint" cx="4" cy="62" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-rose" cx="62" cy="64" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ef3b8e" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ef3b8e" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="page-clip"><rect x="0" y="8" width="64" height="56" rx="12"/></clipPath>

    <!-- Header band: mint to pink, a hue rotation across the width -->
    <linearGradient id="band" x1="0" y1="0" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="0.55" stop-color="#f0a8d6"/>
      <stop offset="1" stop-color="#f98cc0"/>
    </linearGradient>
    <!-- Rings: deep emerald to deep magenta -->
    <linearGradient id="ring" x1="14" y1="0" x2="50" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b7d78"/>
      <stop offset="1" stop-color="#b72c74"/>
    </linearGradient>
    <linearGradient id="today" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fbcfe8"/>
    </linearGradient>
  </defs>

  <!-- Calendar page: fills the whole canvas, no margin -->
  <rect x="0" y="8" width="64" height="56" rx="12" fill="url(#page)"/>
  <g clip-path="url(#page-clip)">
    <rect x="0" y="8" width="64" height="56" fill="url(#glow-pink)"/>
    <rect x="0" y="8" width="64" height="56" fill="url(#glow-mint)"/>
    <rect x="0" y="8" width="64" height="56" fill="url(#glow-rose)"/>
    <rect x="0" y="8" width="64" height="17" fill="url(#band)"/>
    <g fill="#fff">
      <circle cx="5" cy="31" r="0.8" opacity="0.7"/>
      <circle cx="59" cy="33" r="0.9" opacity="0.7"/>
      <circle cx="24" cy="59" r="0.8" opacity="0.6"/>
      <circle cx="41" cy="30" r="0.6" opacity="0.5"/>
      <circle cx="57" cy="59" r="0.7" opacity="0.6"/>
    </g>
  </g>

  <!-- Rings -->
  <rect x="14" y="0" width="8" height="18" rx="4" fill="url(#ring)"/>
  <rect x="42" y="0" width="8" height="18" rx="4" fill="url(#ring)"/>

  <!-- Dates: the last one is "today" -->
  <g fill="#fff" fill-opacity="0.6">
    <circle cx="16" cy="37" r="4.8"/>
    <circle cx="32" cy="37" r="4.8"/>
    <circle cx="48" cy="37" r="4.8"/>
    <circle cx="16" cy="51" r="4.8"/>
    <circle cx="32" cy="51" r="4.8"/>
  </g>
  <circle cx="48" cy="51" r="4.8" fill="url(#today)"/>
</svg>
